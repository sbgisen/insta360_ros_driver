/**:
  ros__parameters:
    # === 動作モード設定 ===
    use_image_trigger: false # true: 画像トリガーモード, false: タイマーモード
    image_topic: "/camera_image" # 画像トリガーモード時のサブスクライブトピック
    image_type: "raw" # "raw" or "compressed" (画像の種類)

    # === 基本設定 ===
    # フレームID（注意：画像トリガーモードでは画像のframe_idが優先される）
    frame_id: "rear_camera_frame" # タイマーモード時のみ使用
    publish_rate: 1.0 # タイマーモード時の配信頻度 [Hz]

    # === カメラ情報 ===
    image_width: 1152
    image_height: 1152
    camera_name: narrow_stereo
    camera_matrix:
      rows: 3
      cols: 3
      data:
        [307.77202, -0.09099, 569.54805, 0., 307.2597, 585.53978, 0., 0., 1.]
    distortion_model: equidistant
    distortion_coefficients:
      rows: 1
      cols: 4
      data: [0.056735, -0.009356, 0.002468, -0.001583]
    rectification_matrix:
      rows: 3
      cols: 3
      data: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
    projection_matrix:
      rows: 3
      cols: 4
      data:
        [
          307.77202,
          -0.09099,
          569.54805,
          0.,
          0.,
          307.2597,
          585.53978,
          0.,
          0.,
          0.,
          1.,
          0.,
        ]
